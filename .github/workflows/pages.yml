# Publishes ZendAppKit example ZApps (and the browser SDK they import) to Cloudflare Pages.
# Result: https://zapps-examples.pages.dev/coinflip/
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: ZApp examples → Cloudflare Pages
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          # Creates the project on first run; later runs see "already exists" and carry on.
          preCommands: npx wrangler pages project create zapps-examples --production-branch main || true
          command: pages deploy site --project-name zapps-examples --branch main
